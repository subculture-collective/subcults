services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: subcults-postgres
    environment:
      POSTGRES_USER: subcults
      POSTGRES_DB: subcults
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subcults-dev-password}
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U subcults']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local development API. The explicit in-memory switch is intentional until
  # durable domain repository adapters exist; production must leave it unset.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: subcults-api
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      DATABASE_URL: postgres://subcults:${POSTGRES_PASSWORD:-subcults-dev-password}@postgres:5432/subcults?sslmode=disable
      PORT: '8080'
      SUBCULT_ENV: development
      SUBCULT_IN_MEMORY_REPOSITORIES: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
