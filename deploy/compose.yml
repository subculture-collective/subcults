# Environment variables are loaded from .env file in this directory
# Copy .env.example to .env and fill in required values

services:
  # =============================================================================
  # API - Go backend server
  # Exposed to external Caddy via 'web' network, internal services via 'internal'
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: subcults-api
    expose:
      - '8080'
    environment:
      - SUBCULT_ENV=${SUBCULT_ENV:-production}
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_CURRENT=${JWT_SECRET_CURRENT:-}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL}
      - CONTACT_ENCRYPTION_KEY=${CONTACT_ENCRYPTION_KEY}
      - CONTACT_HMAC_KEY=${CONTACT_HMAC_KEY}
      - POSTMARK_TRANSACTIONAL_TOKEN=${POSTMARK_TRANSACTIONAL_TOKEN}
      - POSTMARK_FROM=${POSTMARK_FROM}
      - POSTMARK_TRANSACTIONAL_STREAM=${POSTMARK_TRANSACTIONAL_STREAM:-outbound}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_ONBOARDING_RETURN_URL=${STRIPE_ONBOARDING_RETURN_URL}
      - STRIPE_ONBOARDING_REFRESH_URL=${STRIPE_ONBOARDING_REFRESH_URL}
      - STRIPE_APPLICATION_FEE_PERCENT=${STRIPE_APPLICATION_FEE_PERCENT:-5.0}
      - MAPTILER_API_KEY=${MAPTILER_API_KEY}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_MAX_UPLOAD_SIZE_MB=${R2_MAX_UPLOAD_SIZE_MB:-15}
      - REDIS_URL=${REDIS_URL:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - ATPROTO_OAUTH_ENABLED=${ATPROTO_OAUTH_ENABLED:-false}
      - ATPROTO_OAUTH_CLIENT_ID=${ATPROTO_OAUTH_CLIENT_ID:-}
      - ATPROTO_OAUTH_CALLBACK_URL=${ATPROTO_OAUTH_CALLBACK_URL:-}
      - ATPROTO_OAUTH_JWKS_URL=${ATPROTO_OAUTH_JWKS_URL:-}
      - ATPROTO_OAUTH_CLIENT_PRIVATE_KEY=${ATPROTO_OAUTH_CLIENT_PRIVATE_KEY:-}
      - ATPROTO_OAUTH_CLIENT_KEY_ID=${ATPROTO_OAUTH_CLIENT_KEY_ID:-subcults-1}
      - ATPROTO_SESSION_ENCRYPTION_KEY=${ATPROTO_SESSION_ENCRYPTION_KEY:-}
      - ATPROTO_DEFAULT_PDS_URL=${ATPROTO_DEFAULT_PDS_URL:-https://pds.subcult.tv}
      - ATPROTO_HANDLE_DOMAIN=${ATPROTO_HANDLE_DOMAIN:-subcult.tv}
      - ATPROTO_TURNSTILE_SECRET=${ATPROTO_TURNSTILE_SECRET:-}
      - ATPROTO_TERMS_VERSION=${ATPROTO_TERMS_VERSION:-2026-08-09}
      - PDS_SIGNUP_ENABLED=${PDS_SIGNUP_ENABLED:-false}
      - PDS_SIGNUP_DAILY_CAP=${PDS_SIGNUP_DAILY_CAP:-25}
      - PDS_PROVISIONER_URL=${PDS_PROVISIONER_URL:-http://pds-provisioner:8090}
      - PDS_PROVISIONER_TOKEN=${PDS_PROVISIONER_TOKEN:-}
      - ATPROTO_TAP_URL=${ATPROTO_TAP_URL:-http://tap:2480}
      - ATPROTO_TAP_ADMIN_PASSWORD=${ATPROTO_TAP_ADMIN_PASSWORD:-}
      - RANK_TRUST_ENABLED=${RANK_TRUST_ENABLED:-false}
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - TRACING_EXPORTER_TYPE=${TRACING_EXPORTER_TYPE:-otlp-http}
      - TRACING_OTLP_ENDPOINT=${TRACING_OTLP_ENDPOINT:-}
      - TRACING_SAMPLE_RATE=${TRACING_SAMPLE_RATE:-0.1}
      - TRACING_INSECURE=${TRACING_INSECURE:-false}
      - CANARY_ENABLED=${CANARY_ENABLED:-false}
      - CANARY_TRAFFIC_PERCENT=${CANARY_TRAFFIC_PERCENT:-5.0}
      - CANARY_ERROR_THRESHOLD=${CANARY_ERROR_THRESHOLD:-1.0}
      - CANARY_LATENCY_THRESHOLD=${CANARY_LATENCY_THRESHOLD:-2.0}
      - CANARY_AUTO_ROLLBACK=${CANARY_AUTO_ROLLBACK:-true}
      - CANARY_MONITORING_WINDOW=${CANARY_MONITORING_WINDOW:-300}
      - CANARY_VERSION=${CANARY_VERSION:-canary}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization,X-Request-ID}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-3600}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8080/health/live',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - web
      - internal
    restart: unless-stopped

  pds-provisioner:
    profiles: ['atproto']
    build:
      context: ..
      dockerfile: Dockerfile.pds-provisioner
    container_name: subcults-pds-provisioner
    environment:
      - PDS_URL=${ATPROTO_DEFAULT_PDS_URL:-https://pds.subcult.tv}
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_PROVISIONER_TOKEN=${PDS_PROVISIONER_TOKEN}
    expose:
      - '8090'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    restart: unless-stopped

  tap:
    profiles: ['atproto']
    build:
      context: ..
      dockerfile: Dockerfile.tap
    container_name: subcults-tap
    environment:
      - TAP_DATABASE_URL=sqlite:///data/tap.db
      - TAP_BIND=:2480
      - TAP_COLLECTION_FILTERS=tv.subcult.*,app.subcult.*
      - TAP_WEBHOOK_URL=http://api:8080/internal/atproto/tap
      - TAP_ADMIN_PASSWORD=${ATPROTO_TAP_ADMIN_PASSWORD}
      - TAP_DISABLE_ACKS=false
      - TAP_NO_REPLAY=false
      - TAP_METRICS_LISTEN=:2481
    expose:
      - '2480'
      - '2481'
    volumes:
      - tap_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider --user=admin --password="$${TAP_ADMIN_PASSWORD}" http://localhost:2480/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # Indexer - Jetstream consumer (internal network only)
  # =============================================================================
  indexer:
    build:
      context: ..
      dockerfile: Dockerfile.indexer
    container_name: subcults-indexer
    environment:
      - SUBCULT_ENV=${SUBCULT_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - JETSTREAM_HOST=${JETSTREAM_HOST:-jetstream.us-west.bsky.network}
      - JETSTREAM_API_KEY=${JETSTREAM_API_KEY:-}
      - JETSTREAM_BATCH_SIZE=${JETSTREAM_BATCH_SIZE:-256}
      - METRICS_PORT=${METRICS_PORT:-9090}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN:-}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal
    restart: unless-stopped

  # =============================================================================
  # Frontend - Nginx serving built static assets
  # Exposed to external Caddy via 'web' network
  # =============================================================================
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_MAPTILER_API_KEY=${VITE_MAPTILER_API_KEY:-}
        - VITE_R2_CDN_URL=${VITE_R2_CDN_URL:-}
        - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY:-}
        - VITE_LIVEKIT_WS_URL=${VITE_LIVEKIT_WS_URL:-}
        - VITE_TURNSTILE_SITE_KEY=${ATPROTO_TURNSTILE_SITE_KEY:-}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-dev}
    container_name: subcults-frontend
    expose:
      - '80'
    networks:
      - web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  web:
    external: true
  internal:
    driver: bridge
    name: subcults-internal

# =============================================================================
# Volumes
# =============================================================================
volumes:
  tap_data:
