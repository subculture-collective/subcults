name: Secret Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    # Run weekly on Mondays at 9:00 AM UTC (aligned with other security scans)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate secret scanning across all commits
          fetch-depth: 0

      - name: Run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]] \
            && [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            SCAN_RANGE="$BASE_SHA..$GITHUB_SHA"
          else
            SCAN_RANGE="$GITHUB_SHA^..$GITHUB_SHA"
          fi

          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --log-opts="$SCAN_RANGE"
